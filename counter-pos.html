<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Counter — Multi-Shop POS &amp; Inventory</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#23262B">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Counter">
<style>
  :root{
    --paper:#FAF7F0;
    --kraft:#E4D9C3;
    --kraft-dark:#D8C9A8;
    --ink:#23262B;
    --ink-soft:#5B5F66;
    --red:#C1442D;
    --red-dark:#A3371F;
    --sage:#6B8F71;
    --sage-dark:#547258;
    --butter:#E8B23D;
    --line: rgba(35,38,43,0.14);
    --line-strong: rgba(35,38,43,0.28);
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--kraft);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .display{
    font-family:Arial,"Helvetica Neue",sans-serif;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .mono{ font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; }
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  input,select,textarea{font-family:inherit;font-size:15px;}
  :focus-visible{outline:3px solid var(--red);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important;transition-duration:0.01ms !important;} }

  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;position:sticky;top:0;z-index:40;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;background:var(--red);display:flex;align-items:center;justify-content:center;border-radius:3px;font-weight:900;color:var(--paper);font-family:Arial,sans-serif;font-size:16px;}
  .brand-name{font-size:19px;letter-spacing:0.06em;}
  .brand-sub{font-size:10px;color:#B9B2A2;letter-spacing:0.1em;font-family:"SFMono-Regular",Consolas,monospace;text-transform:uppercase;margin-top:1px;}
  .shop-tag{font-size:11px;color:#D8CFBC;margin-left:8px;padding:4px 10px;border:1px solid rgba(255,255,255,0.2);border-radius:20px;font-family:"SFMono-Regular",Consolas,monospace;}
  .nav-pills{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{background:transparent;border:1px solid rgba(255,255,255,0.25);color:var(--paper);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;letter-spacing:0.03em;transition:background .15s,border-color .15s;}
  .pill:hover{background:rgba(255,255,255,0.1);}
  .pill.active{background:var(--red);border-color:var(--red);}
  .pill.subtle{border-color:rgba(255,255,255,0.15);color:#B9B2A2;}

  main{flex:1;width:100%;}
  footer.appfoot{padding:18px 20px 26px;text-align:center;color:var(--ink-soft);font-size:11px;letter-spacing:0.08em;font-family:"SFMono-Regular",Consolas,monospace;}
  .devdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--kraft-dark);margin-left:8px;cursor:pointer;border:none;vertical-align:middle;padding:0;}
  .devdot:hover{background:var(--ink-soft);}

  .btn{border:none;border-radius:var(--radius);padding:11px 18px;font-weight:700;font-size:14px;letter-spacing:0.02em;transition:transform .08s, background .15s;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-primary:disabled{background:#C9B9A8;color:#8a7f6d;cursor:not-allowed;}
  .btn-dark{background:var(--ink);color:var(--paper);}
  .btn-dark:hover{background:#000;}
  .btn-outline{background:transparent;border:1.5px solid var(--line-strong);color:var(--ink);}
  .btn-outline:hover{border-color:var(--ink);}
  .btn-ghost{background:transparent;color:var(--ink-soft);padding:8px 10px;}
  .btn-ghost:hover{color:var(--ink);}
  .btn-sm{padding:7px 12px;font-size:12.5px;}
  .btn-danger{background:transparent;border:1.5px solid var(--red);color:var(--red);}
  .btn-danger:hover{background:var(--red);color:#fff;}
  .btn-block{width:100%;}

  /* ---- shop select ---- */
  .select-wrap{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .select-card{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ink);padding:34px 30px;width:400px;max-width:100%;}
  .select-card h1{margin:0 0 4px;font-size:22px;}
  .select-card p{margin:0 0 20px;color:var(--ink-soft);font-size:13.5px;}
  .code-input{text-transform:uppercase;letter-spacing:0.14em;font-family:"SFMono-Regular",Consolas,monospace;font-weight:700;text-align:center;font-size:17px;padding:12px;width:100%;border:1.5px solid var(--line-strong);border-radius:4px;background:#fff;}
  .select-btn-row{display:flex;gap:10px;margin-top:14px;}
  .select-err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}
  .select-hint{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line-strong);font-size:11.5px;color:var(--ink-soft);}

  /* ---- lock screen ---- */
  .lock-wrap{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .lock-card{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--red);padding:36px 30px;width:420px;max-width:100%;text-align:center;}
  .lock-icon{width:52px;height:52px;border-radius:50%;background:rgba(193,68,45,0.12);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;font-weight:900;}
  .lock-card h2{margin:0 0 8px;font-size:19px;}
  .lock-card p{color:var(--ink-soft);font-size:13.5px;line-height:1.5;margin:0 0 6px;}
  .lock-meta{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;color:var(--ink-soft);margin:16px 0;padding:12px;background:var(--kraft);border-radius:4px;}

  .pos-wrap{display:grid;grid-template-columns:1fr 340px;gap:0;align-items:start;max-width:1280px;margin:0 auto;}
  @media (max-width:880px){ .pos-wrap{grid-template-columns:1fr;} }
  .pos-menu{padding:22px 24px 60px;}
  .pos-hero{margin-bottom:18px;}
  .pos-hero h1{font-size:30px;margin:0 0 4px;}
  .pos-hero p{margin:0;color:var(--ink-soft);font-size:14px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px;}
  .chip{background:var(--paper);border:1.5px solid var(--line);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
  .pcard{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .18s, transform .12s;}
  .pcard:hover{box-shadow:0 8px 22px rgba(0,0,0,0.12);transform:translateY(-2px);}
  .pcard.disabled{opacity:0.55;}
  .pcard-img{aspect-ratio:1/1;width:100%;background:linear-gradient(145deg,var(--kraft),var(--kraft-dark));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .pcard-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .pcard-letter{font-size:64px;font-weight:900;color:rgba(35,38,43,0.28);font-family:Arial,sans-serif;}
  .badge{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border-radius:12px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.2);}
  .badge-low{background:var(--butter);color:var(--ink);}
  .badge-out{background:var(--red);}
  .pcard-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .pcard-cat{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;}
  .pcard-name{font-size:16px;font-weight:700;line-height:1.25;}
  .pcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;}
  .pcard-price{font-family:"SFMono-Regular",Consolas,monospace;font-weight:700;font-size:16px;}
  .add-btn{background:var(--ink);color:var(--paper);border:none;width:36px;height:36px;border-radius:50%;font-size:19px;line-height:1;font-weight:700;flex-shrink:0;}
  .add-btn:hover{background:var(--red);}
  .add-btn:disabled{background:#C9B9A8;cursor:not-allowed;}
  .empty-note{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--ink-soft);background:var(--paper);border:1px dashed var(--line-strong);border-radius:6px;}

  .ticket-col{position:sticky;top:64px;padding:22px 22px 0 0;}
  @media (max-width:880px){ .ticket-col{position:static;padding:0 20px 20px;} }
  .ticket{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ink);padding:18px 18px 6px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
  .ticket-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
  .ticket-head h2{font-size:13px;letter-spacing:0.14em;text-transform:uppercase;margin:0;font-family:inherit;}
  .ticket-num{font-size:11px;color:var(--ink-soft);}
  .ticket-sub{font-size:10.5px;color:var(--ink-soft);border-bottom:1px dashed var(--line-strong);padding-bottom:10px;margin-bottom:8px;}
  .ticket-items{min-height:60px;max-height:38vh;overflow-y:auto;}
  .ticket-empty{color:var(--ink-soft);font-size:12.5px;padding:18px 0;text-align:center;}
  .ticket-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  .ti-name{font-weight:700;font-size:12.5px;}
  .ti-line{color:var(--ink-soft);font-size:11px;}
  .qty-ctl{display:flex;align-items:center;gap:6px;}
  .qty-btn{width:20px;height:20px;border:1px solid var(--line-strong);background:var(--paper);border-radius:3px;font-size:12px;line-height:1;font-weight:700;padding:0;}
  .qty-btn:hover{background:var(--kraft);}
  .ti-amt{font-weight:700;white-space:nowrap;}
  .ticket-total-row{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 12px;border-top:2px solid var(--ink);margin-top:6px;}
  .ticket-total-label{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-soft);}
  .ticket-total-amt{font-size:22px;font-weight:700;}
  .torn-edge{height:11px;margin:0 -1px;background-image:linear-gradient(-45deg, var(--kraft) 7.5px, transparent 0),linear-gradient(45deg, var(--kraft) 7.5px, transparent 0);background-size:15px 15px;background-position:top;background-repeat:repeat-x;}
  .ticket-pay{padding:16px 2px 4px;}

  .receipt-overlay{position:fixed;inset:0;background:rgba(35,38,43,0.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .receipt-card{background:var(--paper);width:320px;max-width:100%;padding:26px 22px 4px;font-family:"SFMono-Regular",Consolas,monospace;text-align:center;animation:dropIn .25s ease;}
  @keyframes dropIn{from{transform:translateY(-14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .receipt-check{width:46px;height:46px;border-radius:50%;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px;font-weight:900;}
  .receipt-card h3{margin:0 0 2px;font-size:15px;letter-spacing:0.1em;text-transform:uppercase;}
  .receipt-card .rid{color:var(--ink-soft);font-size:11px;margin-bottom:14px;}
  .receipt-list{text-align:left;border-top:1px dashed var(--line-strong);padding-top:10px;}
  .receipt-line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
  .receipt-total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;border-top:2px solid var(--ink);margin-top:10px;padding:10px 0;}

  .dash{display:grid;grid-template-columns:200px 1fr;max-width:1320px;margin:0 auto;min-height:calc(100vh - 62px);}
  @media (max-width:820px){ .dash{grid-template-columns:1fr;} }
  .sidenav{padding:22px 14px;border-right:1px solid var(--line-strong);background:var(--paper);}
  @media (max-width:820px){ .sidenav{border-right:none;border-bottom:1px solid var(--line-strong);display:flex;overflow-x:auto;gap:4px;padding:12px;} }
  .sidenav button{display:block;width:100%;text-align:left;background:transparent;border:none;padding:10px 12px;border-radius:4px;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:2px;white-space:nowrap;}
  .sidenav button:hover{background:var(--kraft);color:var(--ink);}
  .sidenav button.active{background:var(--ink);color:var(--paper);}
  .dash-main{padding:26px 28px 60px;overflow-x:auto;}
  .dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .dash-head h2{margin:0;font-size:22px;}
  .dash-head p{margin:2px 0 0;color:var(--ink-soft);font-size:13px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:26px;}
  .stat-card{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--red);padding:16px;border-radius:4px;}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);font-weight:700;}
  .stat-val{font-size:26px;font-weight:800;margin-top:4px;font-family:"SFMono-Regular",Consolas,monospace;}

  table{width:100%;border-collapse:collapse;background:var(--paper);font-size:13.5px;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);}
  th{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);font-weight:700;background:var(--kraft);}
  tr:hover td{background:rgba(0,0,0,0.02);}
  .table-wrap{border:1px solid var(--line);border-radius:4px;overflow:hidden;overflow-x:auto;}

  .badge-tag{font-size:10.5px;font-weight:800;letter-spacing:0.04em;padding:3px 9px;border-radius:12px;text-transform:uppercase;display:inline-block;}
  .tag-avail{background:rgba(107,143,113,0.18);color:var(--sage-dark);}
  .tag-low{background:rgba(232,178,61,0.25);color:#8a6412;}
  .tag-out{background:rgba(193,68,45,0.15);color:var(--red);}
  .tag-hidden{background:rgba(35,38,43,0.1);color:var(--ink-soft);}
  .tag-susp{background:rgba(35,38,43,0.1);color:var(--ink-soft);}

  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .prod-thumb{width:34px;height:34px;border-radius:4px;background:var(--kraft);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink-soft);font-size:14px;overflow:hidden;vertical-align:middle;margin-right:8px;}
  .prod-thumb img{width:100%;height:100%;object-fit:cover;}
  .prod-cell{display:flex;align-items:center;}

  .section-card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px;margin-bottom:18px;}
  .section-card h3{margin:0 0 4px;font-size:16px;}
  .section-card .sc-note{color:var(--ink-soft);font-size:12.5px;margin:0 0 14px;}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  @media (max-width:560px){ .field-row{grid-template-columns:1fr;} }
  .field label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line-strong);border-radius:4px;background:#fff;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-note{font-size:11px;color:var(--ink-soft);margin-top:4px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .toolbar input[type=text],.toolbar select{padding:9px 12px;border:1.5px solid var(--line-strong);border-radius:4px;font-size:13.5px;background:#fff;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(35,38,43,0.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:var(--paper);width:460px;max-width:100%;max-height:88vh;overflow-y:auto;border-radius:5px;padding:24px;animation:dropIn .18s ease;}
  .modal h3{margin:0 0 4px;font-size:18px;}
  .modal .m-note{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ink);padding:32px 28px;width:340px;max-width:100%;}
  .login-card h2{margin:0 0 4px;}
  .login-card p{margin:0 0 18px;color:var(--ink-soft);font-size:13px;}
  .login-err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:16px;}

  .devshell{background:var(--ink);color:var(--paper);min-height:100vh;}
  .devshell .dash-main{color:var(--paper);}
  .devshell table{background:#1B1E22;color:var(--paper);}
  .devshell th{background:#2A2D33;color:#B9B2A2;}
  .devshell td{border-color:rgba(255,255,255,0.1);}
  .devshell tr:hover td{background:rgba(255,255,255,0.03);}
  .devshell .section-card{background:#1B1E22;border-color:rgba(255,255,255,0.12);}
  .devshell .sidenav{background:#1B1E22;border-color:rgba(255,255,255,0.12);}
  .devshell .sidenav button{color:#B9B2A2;}
  .devshell .sidenav button.active{background:var(--red);color:#fff;}
  .devshell .stat-card{background:#1B1E22;border-color:rgba(255,255,255,0.12);}
  .devshell .field label{color:#9a9a9a;}
  .devshell .field input,.devshell .field select{background:#2A2D33;border-color:rgba(255,255,255,0.18);color:#fff;}
  .devshell .m-note{color:#9a9a9a;}
  .devshell .modal{background:#1B1E22;}
  .devshell .modal h3{color:#fff;}
  pre.rawjson{background:#111316;color:#9BE39B;padding:14px;border-radius:4px;font-size:11.5px;overflow-x:auto;max-height:340px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:5px;font-size:13.5px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,0.25);}
  .install-banner{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--ink);color:var(--paper);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,0.2);font-size:13.5px;}
  .install-banner span{flex:1 1 220px;}
  .install-banner .btn-sm{padding:7px 14px;font-size:13px;}
  .install-banner .btn-ghost{color:var(--paper);opacity:0.75;}
  .install-banner .btn-ghost:hover{opacity:1;color:var(--paper);}
  .loading-screen{min-height:70vh;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;letter-spacing:0.08em;text-transform:uppercase;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <div class="brand-name display">Counter</div>
        <div class="brand-sub">Multi-Shop POS</div>
      </div>
      <span id="shopTag"></span>
    </div>
    <nav class="nav-pills" id="navPills"></nav>
  </header>
  <main id="viewRoot"><div class="loading-screen">Loading…</div></main>
  <footer class="appfoot">Counter POS · v2.0<button class="devdot" id="devDot" title="" aria-label="hidden"></button></footer>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";

/* ================= GLOBAL STATE ================= */
let clientsRegistry = { clients: [] };          // pos-clients (shared)
let devSettings = { devPassword: "dev2026" };    // pos-dev-settings (shared)
let shopData = { products: [], orders: [], invLog: [], staff: [] }; // active shop's blob
let currentClientId = null;

let view = "select";      // select | customer | admin | dev
let adminAuthed = false;
let devAuthed = false;
let adminTab = "overview";
let devTab = "clients";
let categoryFilter = "All";
let invHistoryFilter = "all";
let ready = false;
let shopSelectErr = "";
let devViewedClientId = null;
let devViewedShopData = null;

const LOW_STOCK_THRESHOLD = 5;

/* ================= HELPERS ================= */
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){ return (Math.round((n + Number.EPSILON) * 100) / 100).toFixed(2); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ const dt = new Date(d); return dt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) + " " + dt.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); }
function fmtDay(d){ return new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function statusOf(p){
  if(p.status === "hidden") return {key:"hidden", label:"Hidden"};
  if(p.stock <= 0) return {key:"out", label:"Out of Stock"};
  if(p.stock <= LOW_STOCK_THRESHOLD) return {key:"low", label:"Low Stock"};
  return {key:"avail", label:"Available"};
}
function toast(msg){
  const root = document.getElementById("toastRoot");
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function addPlanDuration(fromISO, plan){
  const d = new Date(fromISO);
  if(plan === "annual") d.setFullYear(d.getFullYear()+1);
  else d.setMonth(d.getMonth()+1);
  return d.toISOString();
}
function daysLeft(endISO){
  const ms = new Date(endISO) - new Date();
  return Math.ceil(ms / (1000*60*60*24));
}
function genShopCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code;
  do{
    code = "";
    for(let i=0;i<6;i++) code += chars.charAt(Math.floor(Math.random()*chars.length));
  }while(clientsRegistry.clients.some(c=>c.shopCode===code));
  return code;
}
function getCurrentClient(){ return clientsRegistry.clients.find(c=>c.id===currentClientId) || null; }

/* ---- storage layer, with real offline support ----
   - shared:false data (e.g. "remember my last shop code on this device") always
     stays in this browser's localStorage — it's personal, not business data.
   - shared:true data uses a cloud provider when available (window.CounterStorageProvider,
     e.g. Firebase — or window.storage, the built-in Claude artifact storage API), but
     EVERY successful cloud read/write is also mirrored into localStorage as an offline
     cache. If the cloud is unreachable (no connection, Firestore down, etc.), reads and
     writes automatically fall back to that local cache instead of silently failing —
     the app keeps working, and the person is told they're working offline via a toast.
   None of these ever throw — every call is safe to await. ---- */
const hasCloudStorage = (typeof window !== "undefined") && window.storage && typeof window.storage.get === "function";
function localGet(key){
  try{ const raw = localStorage.getItem("cpos:"+key); return raw ? { key, value: raw } : null; }catch(e){ return null; }
}
function localSet(key, value){
  try{ localStorage.setItem("cpos:"+key, value); return { key, value }; }catch(e){ return null; }
}
function localDelete(key){
  try{ localStorage.removeItem("cpos:"+key); return { key, deleted:true }; }catch(e){ return null; }
}
function localList(prefix){
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf("cpos:"+(prefix||"")) === 0) keys.push(k.slice(5));
    }
    return { keys };
  }catch(e){ return { keys: [] }; }
}
function getCloudProvider(){
  if(window.CounterStorageProvider) return window.CounterStorageProvider;
  if(hasCloudStorage) return window.storage;
  return null;
}
let __offlineToastShownAt = 0;
function offlineToast(msg){
  // avoid spamming a toast for every single field save during a rocky connection
  const now = Date.now();
  if(now - __offlineToastShownAt > 4000){ __offlineToastShownAt = now; toast(msg); }
}
async function storageGet(key, shared){
  if(!shared) return localGet(key);
  const provider = getCloudProvider();
  if(!provider) return localGet(key);
  try{
    const result = await provider.get(key, shared);
    if(result && result.__failed){
      const cached = localGet(key);
      offlineToast(cached ? "Offline — showing your last saved data." : "Offline — no saved data on this device yet.");
      return cached;
    }
    if(result){ localSet(key, result.value); return result; } // keep offline cache fresh
    return null; // genuinely no data saved anywhere yet
  }catch(e){
    const cached = localGet(key);
    offlineToast(cached ? "Offline — showing your last saved data." : "Offline — no saved data on this device yet.");
    return cached;
  }
}
async function storageSet(key, value, shared){
  if(!shared) return localSet(key, value);
  const provider = getCloudProvider();
  if(!provider) return localSet(key, value);
  try{
    const result = await provider.set(key, value, shared);
    if(result && result.__failed){
      offlineToast("Offline — saved on this device, will sync once you're back online.");
      return localSet(key, value);
    }
    if(result){ localSet(key, value); return result; } // keep offline cache in sync too
    offlineToast("Offline — saved on this device, will sync once you're back online.");
    return localSet(key, value);
  }catch(e){
    offlineToast("Offline — saved on this device, will sync once you're back online.");
    return localSet(key, value);
  }
}
async function storageDelete(key, shared){
  if(!shared) return localDelete(key);
  const provider = getCloudProvider();
  if(!provider) return localDelete(key);
  try{
    const result = await provider.delete(key, shared);
    localDelete(key); // keep offline cache in sync regardless
    if(result && result.__failed) offlineToast("Offline — removed on this device, will sync once you're back online.");
    return result && !result.__failed ? result : { key, deleted:true };
  }catch(e){
    localDelete(key);
    offlineToast("Offline — removed on this device, will sync once you're back online.");
    return { key, deleted:true };
  }
}
async function storageList(prefix, shared){
  if(!shared) return localList(prefix);
  const provider = getCloudProvider();
  if(!provider) return localList(prefix);
  try{
    const result = await provider.list(prefix, shared);
    if(result && result.__failed) return localList(prefix);
    return result || { keys: [] };
  }catch(e){
    return localList(prefix);
  }
}

function effectiveStatus(client){
  if(!client) return {key:"missing", label:"Not Found"};
  if(client.status === "suspended") return {key:"suspended", label:"Suspended"};
  if(new Date() > new Date(client.subscriptionEnd)) return {key:"expired", label:"Expired"};
  return {key:"active", label:"Active"};
}

/* ================= STORAGE ================= */
async function loadAll(){
  try{ const r = await storageGet("pos-clients", true); clientsRegistry = r ? JSON.parse(r.value) : null; }catch(e){ clientsRegistry = null; }
  try{ const r = await storageGet("pos-dev-settings", true); devSettings = r ? JSON.parse(r.value) : null; }catch(e){ devSettings = null; }

  if(!clientsRegistry){
    clientsRegistry = { clients: [] };
    await saveClientsRegistry();
  }
  if(!devSettings){ devSettings = { devPassword: "dev2026" }; await saveDevSettings(); }

  try{
    const r = await storageGet("pos-last-shop", false);
    if(r){ const saved = JSON.parse(r.value); if(saved && saved.code) lastShopCodeHint = saved.code; }
  }catch(e){ /* none saved yet */ }

  ready = true;
}
let lastShopCodeHint = "";
async function saveClientsRegistry(){ try{ await storageSet("pos-clients", JSON.stringify(clientsRegistry), true); }catch(e){ toast("Couldn't save client list — try again"); } }
async function saveDevSettings(){ try{ await storageSet("pos-dev-settings", JSON.stringify(devSettings), true); }catch(e){ toast("Couldn't save developer settings"); } }
async function loadShopData(clientId){
  try{
    const r = await storageGet("pos-shop-"+clientId, true);
    shopData = r ? JSON.parse(r.value) : { products:[], orders:[], invLog:[], staff:[] };
  }catch(e){ shopData = { products:[], orders:[], invLog:[], staff:[] }; }
}
async function saveShopData(){ try{ await storageSet("pos-shop-"+currentClientId, JSON.stringify(shopData), true); }catch(e){ toast("Couldn't save — try again"); } }
async function rememberShopCode(code){ try{ await storageSet("pos-last-shop", JSON.stringify({code}), false); }catch(e){} }

/* ================= RENDER DISPATCH ================= */
function render(){
  renderNav();
  const root = document.getElementById("viewRoot");
  if(!ready){ root.innerHTML = '<div class="loading-screen">Loading…</div>'; return; }

  if(view === "select"){ root.innerHTML = renderShopSelect(); }
  else if(view === "dev"){ root.innerHTML = devAuthed ? renderDev() : renderLogin("dev"); }
  else{
    const client = getCurrentClient();
    if(!client){ view = "select"; root.innerHTML = renderShopSelect(); }
    else{
      const st = effectiveStatus(client);
      if(st.key !== "active"){ root.innerHTML = renderLockScreen(client, st); }
      else if(view === "customer"){ root.innerHTML = renderCustomer(); }
      else if(view === "admin"){ root.innerHTML = adminAuthed ? renderAdmin() : renderLogin("admin"); }
    }
  }
  attachDynamicHandlers();
}
function renderNav(){
  const nav = document.getElementById("navPills");
  const tag = document.getElementById("shopTag");
  const client = getCurrentClient();
  if(client && view !== "select" && view !== "dev"){
    tag.innerHTML = `<span class="shop-tag">${esc(client.businessName)} · ${esc(client.shopCode)}</span>`;
  } else { tag.innerHTML = ""; }

  if(view === "dev"){ nav.innerHTML = ""; return; }
  if(!client){ nav.innerHTML = ""; return; }
  nav.innerHTML = `
    <button class="pill ${view==='customer'?'active':''}" data-nav="customer">Counter</button>
    <button class="pill ${view==='admin'?'active':''}" data-nav="admin">Admin</button>
    <button class="pill subtle" data-action="switch-shop">Switch Shop</button>
  `;
}

      <div class="select-hint">New pop-up? Ask your Counter POS administrator for your shop code.</div>
    </div>

async function enterShop(target){
  const raw = document.getElementById("shopCodeInput").value.trim().toUpperCase();
  shopSelectErr = "";
  if(!raw){ shopSelectErr = "Enter a shop code."; render(); return; }
  const client = clientsRegistry.clients.find(c=>c.shopCode === raw);
  if(!client){ shopSelectErr = "No shop found with that code."; render(); return; }
  currentClientId = client.id;
  await loadShopData(client.id);
  await rememberShopCode(raw);
  lastShopCodeHint = raw;
  adminAuthed = false;
  view = target;
  render();
}
function switchShop(){
  currentClientId = null; shopData = { products:[], orders:[], invLog:[], staff:[] };
  adminAuthed = false; view = "select"; shopSelectErr = "";
  render();
}

function renderLockScreen(client, st){
  const expired = st.key === "expired";
  const heading = expired ? "Subscription Expired" : "Access Suspended";
  const body = expired
    ? `This shop's ${client.plan} plan ended on ${fmtDay(client.subscriptionEnd)}. The counter and admin dashboard are locked until it's approved and renewed by the Counter POS administrator.`
    : `This shop has been temporarily suspended by the Counter POS administrator. Contact them to restore access.`;
  return `
  <div class="lock-wrap">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2>${heading}</h2>
      <p>${body}</p>
      <div class="lock-meta">
        ${esc(client.businessName)}<br>Shop Code: ${esc(client.shopCode)}<br>Plan: ${client.plan==='annual'?'Annual':'Monthly'}
      </div>
      <button class="btn btn-outline btn-block" data-action="switch-shop">Switch Shop</button>
    </div>

}

  const val = document.getElementById("loginPass").value;

}

/* Ticket markup is split out so a tap on a product can refresh just the ticket
   (and that one button) instead of rebuilding the whole product grid + images
   on every tap — this is what was causing the slowdown during busy periods. */
function renderTicketColInner(){
  const ticketRows = cart.length ? cart.map(c=>{
    const p = shopData.products.find(pp=>pp.id===c.productId);
    if(!p) return "";
    return `
    <div class="ticket-row">
      <div><div class="ti-name">${esc(p.name)}</div><div class="ti-line">${money(p.price)} each</div></div>
      <div class="qty-ctl">
        <button class="qty-btn" data-action="cart-dec" data-id="${p.id}">−</button>
        <span>${c.qty}</span>
        <button class="qty-btn" data-action="cart-inc" data-id="${p.id}">+</button>
      </div>
      <div class="ti-amt">${money(p.price*c.qty)}</div>
    </div>`;
  }).join("") : `<div class="ticket-empty">No items yet.<br>Tap a product to add it.</div>`;

  const total = cart.reduce((sum,c)=>{ const p = shopData.products.find(pp=>pp.id===c.productId); return sum + (p?p.price*c.qty:0); },0);
  const itemCount = cart.reduce((n,c)=>n+c.qty,0);

  return `
  <div class="ticket">
    <div class="ticket-head"><h2>Order Ticket</h2><span class="ticket-num">#${String(shopData.orders.length+1).padStart(4,'0')}</span></div>
    <div class="ticket-sub">${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${itemCount} item${itemCount===1?'':'s'}</div>
    <div class="ticket-items">${ticketRows}</div>
    <div class="ticket-total-row"><span class="ticket-total-label">Total</span><span class="ticket-total-amt">${money(total)}</span></div>
  </div>
  <div class="torn-edge"></div>
  <div class="ticket-pay">
    <button class="btn btn-primary btn-block" data-action="checkout" ${cart.length?'':'disabled'}>Pay ${cart.length?money(total):''}</button>
    ${cart.length ? `<button class="btn btn-ghost btn-block" data-action="cart-clear" style="margin-top:6px;">Clear ticket</button>` : ""}
  </div>`;
}

/* Fast path for cart taps: patch the ticket column and the one tapped
   product's button directly, skipping the full-page rebuild. Falls back to
   a normal full render() if the customer screen isn't actually on-screen
   (e.g. called from somewhere unexpected) so nothing can go stale. */
function refreshCartUI(touchedId){
  const ticketCol = document.getElementById("ticketCol");
  if(!ticketCol || view !== "customer"){ render(); return; }
  ticketCol.innerHTML = renderTicketColInner();
  if(touchedId){
    const btn = document.querySelector(`.add-btn[data-action="cart-add"][data-id="${CSS.escape(touchedId)}"]`);
    if(btn){ const inCart = cart.find(c=>c.productId===touchedId); btn.textContent = inCart ? inCart.qty : "+"; }
  }
}

let cart = [];
function cartAdd(id){
  const p = shopData.products.find(x=>x.id===id);
  if(!p) return;
  const existing = cart.find(c=>c.productId===id);
  const currentQty = existing ? existing.qty : 0;
  if(currentQty + 1 > p.stock){ toast(`Only ${p.stock} ${p.name} left`); return; }
  if(existing) existing.qty += 1; else cart.push({productId:id, qty:1});
  refreshCartUI(id);
}
function cartInc(id){ cartAdd(id); }
function cartDec(id){
  const existing = cart.find(c=>c.productId===id);
  if(!existing) return;
  existing.qty -= 1;
  if(existing.qty <= 0) cart = cart.filter(c=>c.productId!==id);
  refreshCartUI(id);
}
function cartClear(){ cart = []; render(); }

async function checkout(){
  if(!cart.length) return;
  const items = cart.map(c=>{ const p = shopData.products.find(x=>x.id===c.productId); return { productId:p.id, name:p.name, price:p.price, qty:c.qty }; });
  const total = items.reduce((s,i)=>s+i.price*i.qty,0);
  const order = { id: uid("ord"), date: new Date().toISOString(), staff:"Counter Sale", items, total, paymentStatus:"Paid" };
  items.forEach(i=>{
    const p = shopData.products.find(x=>x.id===i.productId);
    if(!p) return;
    const prevStock = p.stock;
    p.stock = Math.max(0, p.stock - i.qty);
    shopData.invLog.push({ id: uid("inv"), date: order.date, productId:p.id, productName:p.name, previousStock:prevStock, newStock:p.stock, changeType:"sale", orderId: order.id });
  });
  shopData.orders.push(order);
  await saveShopData();
  cart = [];
  showReceipt(order);
  render();
}
function showReceipt(order){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
  <div class="receipt-overlay" data-action="close-receipt">
    <div class="receipt-card">
      <div class="receipt-check">✓</div>
      <h3>Sale Complete</h3>
      <div class="rid">Order #${order.id.slice(-6).toUpperCase()} · ${fmtDate(order.date)}</div>
      <div class="receipt-list">${order.items.map(i=>`<div class="receipt-line"><span>${i.qty}× ${esc(i.name)}</span><span>${money(i.price*i.qty)}</span></div>`).join("")}</div>
      <div class="receipt-total"><span>Total</span><span>${money(order.total)}</span></div>
      <button class="btn btn-dark btn-block" style="margin:16px 0 20px;" data-action="close-receipt">New Order</button>
    </div>
  </div>`;
}
function closeReceipt(){ document.getElementById("modalRoot").innerHTML = ""; render(); }

function ordersOn(dateObj){ return shopData.orders.filter(o=>isSameDay(new Date(o.date), dateObj)); }
function topProductFor(orders){
  const counts = {};
  orders.forEach(o=>o.items.forEach(i=>{ counts[i.name]=(counts[i.name]||0)+i.qty; }));
  const entries = Object.entries(counts);
  if(!entries.length) return "—";
  entries.sort((a,b)=>b[1]-a[1]);
  return entries[0][0];
}
function adminOverview(){
  const today = ordersOn(new Date());
  const todaySales = today.reduce((s,o)=>s+o.total,0);
  const lowStock = shopData.products.filter(p=>p.status!=="hidden" && p.stock>0 && p.stock<=LOW_STOCK_THRESHOLD);
  const outStock = shopData.products.filter(p=>p.stock<=0 && p.status!=="hidden");
  const recent = [...shopData.orders].slice(-6).reverse();
  const client = getCurrentClient();
  return `
  <div class="dash-head"><div><h2>Dashboard</h2><p>Today at a glance · plan ${money0(client)}</p></div></div>
  <div class="stat-grid">

function adminSales(){
  const today = ordersOn(new Date());
  const now = new Date();
  const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-6); weekAgo.setHours(0,0,0,0);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const weekOrders = shopData.orders.filter(o=> new Date(o.date) >= weekAgo);
  const monthOrders = shopData.orders.filter(o=> new Date(o.date) >= monthStart);
  const weekTotal = weekOrders.reduce((s,o)=>s+o.total,0);
  const monthTotal = monthOrders.reduce((s,o)=>s+o.total,0);
  const dayBuckets = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); const dOrders = ordersOn(d); dayBuckets.push({ label: d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}), total: dOrders.reduce((s,o)=>s+o.total,0), count: dOrders.length }); }
  const bestCounts = {};
  shopData.orders.forEach(o=>o.items.forEach(i=>{ bestCounts[i.name]=(bestCounts[i.name]||0)+i.qty; }));
  const best = Object.entries(bestCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const allOrders = [...shopData.orders].reverse().slice(0,30);
  return `
  <div class="dash-head"><div><h2>Sales</h2><p>Reports and transaction history.</p></div></div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Today</div><div class="stat-val">${money(today.reduce((s,o)=>s+o.total,0))}</div></div>
    <div class="stat-card"><div class="stat-label">Last 7 Days</div><div class="stat-val">${money(weekTotal)}</div></div>
    <div class="stat-card"><div class="stat-label">This Month</div><div class="stat-val">${money(monthTotal)}</div></div>
    <div class="stat-card"><div class="stat-label">All-Time Orders</div><div class="stat-val">${shopData.orders.length}</div></div>
  </div>
  <div class="section-card"><h3>Daily Sales — Last 7 Days</h3>
    <div class="table-wrap"><table><thead><tr><th>Day</th><th>Orders</th><th>Sales</th></tr></thead><tbody>
      ${dayBuckets.map(b=>`<tr><td>${b.label}</td><td>${b.count}</td><td>${money(b.total)}</td></tr>`).join("")}
    </tbody></table></div>
  </div>
  <div class="section-card"><h3>Best-Selling Products</h3>
    ${best.length ? `<div class="table-wrap"><table><thead><tr><th>Product</th><th>Units Sold</th></tr></thead><tbody>
      ${best.map(([name,qty])=>`<tr><td>${esc(name)}</td><td>${qty}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty-note">No sales yet.</div>`}
  </div>
  <div class="section-card"><h3>Transactions</h3>
    ${allOrders.length ? `<div class="table-wrap"><table><thead><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>
      ${allOrders.map(o=>`<tr><td>#${o.id.slice(-6).toUpperCase()}</td><td>${fmtDate(o.date)}</td><td>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(", ")}</td><td>${money(o.total)}</td><td><span class="badge-tag tag-avail">${esc(o.paymentStatus)}</span></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty-note">No transactions yet.</div>`}
  </div>
  `;
}

  if(isNaN(newStock) || newStock < 0){ toast("Enter a valid stock number"); return; }
  const prev = p.stock; p.stock = newStock;
  shopData.invLog.push({ id: uid("inv"), date: new Date().toISOString(), productId:p.id, productName:p.name, previousStock:prev, newStock, changeType:reason });
  await saveShopData(); closeModal(); render(); toast("Stock updated");
}
async function stockAdjust(id, delta){
  const p = shopData.products.find(x=>x.id===id);
  if(!p) return;
  const prev = p.stock; p.stock = Math.max(0, p.stock + delta);
  shopData.invLog.push({ id: uid("inv"), date: new Date().toISOString(), productId:p.id, productName:p.name, previousStock:prev, newStock:p.stock, changeType: delta>0?"Restock":"Correction" });
  await saveShopData(); render();
}

async function saveClientFromModal(id){
  const businessName = document.getElementById("cf-name").value.trim();
  const contactEmail = document.getElementById("cf-contact").value.trim();
  const shopCode = document.getElementById("cf-code").value.trim().toUpperCase();
  const plan = document.getElementById("cf-plan").value;
  const adminPassword = document.getElementById("cf-pass").value.trim();
  if(!businessName || !shopCode || adminPassword.length < 4){ toast("Fill in business name, shop code, and a password of 4+ characters."); return; }
  const codeTaken = clientsRegistry.clients.some(c=>c.shopCode===shopCode && c.id!==id);
  if(codeTaken){ toast("That shop code is already in use — choose another."); return; }

  if(id){
    const c = clientsRegistry.clients.find(x=>x.id===id);
    Object.assign(c, { businessName, contactEmail, shopCode, plan, adminPassword });
    await saveClientsRegistry();
    toast("Client updated");
  }else{
    const newId = uid("cli");
    const now = new Date().toISOString();
    clientsRegistry.clients.push({ id:newId, businessName, contactEmail, shopCode, plan, adminPassword, subscriptionStart: now, subscriptionEnd: addPlanDuration(now, plan), status:"active", createdDate: now });
    await saveClientsRegistry();
    await storageSet("pos-shop-"+newId, JSON.stringify({ products:[], orders:[], invLog:[], staff:[] }), true);
    toast("Client created — shop code " + shopCode);
  }
  closeModal(); render();
}
async function renewClient(id){
  const c = clientsRegistry.clients.find(x=>x.id===id);
  if(!c) return;
  const base = new Date() > new Date(c.subscriptionEnd) ? new Date().toISOString() : c.subscriptionEnd;
  c.subscriptionEnd = addPlanDuration(base, c.plan);
  c.status = "active";
  await saveClientsRegistry(); render();
  toast(`Approved — active until ${fmtDay(c.subscriptionEnd)}`);
}
async function toggleSuspend(id){
  const c = clientsRegistry.clients.find(x=>x.id===id);
  if(!c) return;
  c.status = c.status === "suspended" ? "active" : "suspended";
  await saveClientsRegistry(); render();
  toast(c.status === "suspended" ? "Client suspended" : "Client reactivated");
}
function openDeleteClientConfirm(id){
  const c = clientsRegistry.clients.find(x=>x.id===id);
  if(!c) return;
  document.getElementById("modalRoot").innerHTML = `
  <div class="modal-backdrop" data-action="close-modal">
    <div class="modal" style="width:400px;">
      <h3>Delete “${esc(c.businessName)}”?</h3>
      <p class="m-note">This permanently removes the client and all of their products, orders and inventory history. This can't be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-outline" data-action="close-modal">Cancel</button>
        <button class="btn btn-danger" style="background:var(--red);color:#fff;border:none;" data-action="confirm-delete-client" data-id="${c.id}">Delete Client</button>
      </div>
    </div>
  </div>`;
}
async function confirmDeleteClient(id){
  clientsRegistry.clients = clientsRegistry.clients.filter(c=>c.id!==id);
  await saveClientsRegistry();
  try{ await storageDelete("pos-shop-"+id, true); }catch(e){}
  if(currentClientId === id){ currentClientId = null; view = "select"; }
  closeModal(); render(); toast("Client deleted");
}
async function openShopAsDev(id){
  currentClientId = id;
  await loadShopData(id);
  adminAuthed = false;
  view = "customer";
  render();
}

function devData(){
  const options = clientsRegistry.clients.map(c=>`<option value="${c.id}" ${devViewedClientId===c.id?'selected':''}>${esc(c.businessName)} (${esc(c.shopCode)})</option>`).join("");
  return `
  <div class="dash-head"><div><h2 style="color:#fff;">Database Control</h2><p style="color:#9a9a9a;">Raw view of stored data.</p></div>
    <button class="btn btn-dark" data-action="dev-export">Export All (.json)</button>
  </div>
  <div class="section-card"><h3 style="color:#fff;">Clients (${clientsRegistry.clients.length})</h3><pre class="rawjson">${esc(JSON.stringify(clientsRegistry.clients,null,2))}</pre></div>
  <div class="section-card">
    <h3 style="color:#fff;">Inspect a Shop's Data</h3>
    <div class="field" style="max-width:340px;margin-bottom:14px;">
      <select id="devShopSel" data-action-select="dev-view-shop">
        <option value="">Select a client…</option>
        ${options}
      </select>
    </div>
    ${devViewedShopData ? `<pre class="rawjson">${esc(JSON.stringify(devViewedShopData,null,2))}</pre>` : `<p class="sc-note" style="color:#9a9a9a;">Choose a client above to view their products, orders, inventory history and staff.</p>`}
  </div>`;
}
async function devViewShop(id){
  devViewedClientId = id || null;
  if(!id){ devViewedShopData = null; render(); return; }
  try{ const r = await storageGet("pos-shop-"+id, true); devViewedShopData = r ? JSON.parse(r.value) : null; }catch(e){ devViewedShopData = null; }
  render();
}

function devSystem(){
  return `
  <div class="dash-head"><div><h2 style="color:#fff;">System Health</h2><p style="color:#9a9a9a;">Live counts across the whole system.</p></div></div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label" style="color:#9a9a9a;">Clients</div><div class="stat-val" style="color:#fff;">${clientsRegistry.clients.length}</div></div>
    <div class="stat-card"><div class="stat-label" style="color:#9a9a9a;">Active Shops</div><div class="stat-val" style="color:#fff;">${clientsRegistry.clients.filter(c=>effectiveStatus(c).key==='active').length}</div></div>
    <div class="stat-card"><div class="stat-label" style="color:#9a9a9a;">Locked / Expired</div><div class="stat-val" style="color:#fff;">${clientsRegistry.clients.filter(c=>effectiveStatus(c).key!=='active').length}</div></div>
  </div>
  <div class="section-card">
    <h3 style="color:#fff;">Reset ALL Data</h3>
    <p class="sc-note" style="color:#9a9a9a;">Deletes every client and their shop data, leaving the system completely empty. This cannot be undone.</p>
    <button class="btn btn-danger" style="border-color:#e88;color:#e88;" data-action="dev-reset-all">Reset Entire System</button>
  </div>`;
}
async function devExport(){
  const shops = {};
  for(const c of clientsRegistry.clients){
    try{ const r = await storageGet("pos-shop-"+c.id, true); shops[c.shopCode] = r ? JSON.parse(r.value) : null; }catch(e){ shops[c.shopCode] = null; }
  }
  const payload = { clients: clientsRegistry.clients, shops, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "counter-pos-export.json";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast("Export downloaded");
}
async function devResetAll(){
  try{
    const list = await storageList("pos-shop-", true);
    if(list && list.keys){ for(const k of list.keys){ try{ await storageDelete(k, true); }catch(e){} } }
  }catch(e){}
  clientsRegistry = { clients: [] };
  await saveClientsRegistry();
  currentClientId = null; view = "select"; devViewedClientId = null; devViewedShopData = null;
  render(); toast("System reset — all clients and shop data cleared");
}

/* ================= EVENT WIRING ================= */
function attachDynamicHandlers(){
  const invSel = document.getElementById("invFilterSel");
  if(invSel) invSel.addEventListener("change", e=>{ invHistoryFilter = e.target.value; render(); });
  const devShopSel = document.getElementById("devShopSel");
  if(devShopSel) devShopSel.addEventListener("change", e=>{ devViewShop(e.target.value); });
}

document.addEventListener("click", async (e)=>{
  const navBtn = e.target.closest("[data-nav]");
  if(navBtn){ view = navBtn.dataset.nav; render(); return; }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  try{
    switch(action){
      case "filter-cat": categoryFilter = el.dataset.cat; render(); break;
      case "cart-add": cartAdd(id); break;
      case "cart-inc": cartInc(id); break;
      case "cart-dec": cartDec(id); break;
      case "cart-clear": cartClear(); break;
      case "checkout": await checkout(); break;
      case "close-receipt": if(el.classList.contains("receipt-overlay") && e.target !== el) break; closeReceipt(); break;

      case "enter-shop": await enterShop(el.dataset.target); break;
      case "switch-shop": switchShop(); break;

      case "login-admin": doLogin("admin"); break;
      case "login-dev": doLogin("dev"); break;
      case "logout-admin": adminAuthed = false; view = "customer"; render(); break;
      case "logout-dev": devAuthed = false; view = "select"; render(); break;

      case "admin-tab": adminTab = el.dataset.tab; render(); break;
      case "dev-tab": devTab = el.dataset.tab; render(); break;

      case "new-product": openProductModal(null); break;
      case "edit-product": openProductModal(id); break;
      case "save-product": await saveProductFromModal(id||null); break;
      case "delete-product": openDeleteConfirm(id); break;
      case "confirm-delete-product": await deleteProduct(id); break;

      case "stock-adjust": await stockAdjust(id, parseInt(el.dataset.delta,10)); break;
      case "stock-set": openStockSetModal(id); break;
      case "confirm-stock-set": await confirmStockSet(id); break;

      case "new-user": openUserModal(); break;
      case "confirm-add-user": await confirmAddUser(); break;
      case "delete-user": await deleteUser(id); break;

      case "change-pass": await changePassword(el.dataset.kind); break;
      case "close-modal": if(el.classList.contains("modal-backdrop") && e.target !== el) break; closeModal(); break;

      case "new-client": openClientModal(null); break;
      case "edit-client": openClientModal(id); break;
      case "save-client": await saveClientFromModal(id||null); break;
      case "renew-client": await renewClient(id); break;
      case "toggle-suspend": await toggleSuspend(id); break;
      case "delete-client": openDeleteClientConfirm(id); break;
      case "confirm-delete-client": await confirmDeleteClient(id); break;
      case "open-shop-dev": await openShopAsDev(id); break;

      case "dev-export": await devExport(); break;
      case "dev-reset-all": if(confirm("Reset the ENTIRE system? All clients and shop data will be deleted. This cannot be undone.")) await devResetAll(); break;

      case "install-app": promptInstall(); break;
      case "dismiss-install-banner": dismissInstallBanner(); break;
    }
  }catch(err){
    console.error("Action failed:", action, err);
    toast("Something went wrong completing that — please try again.");
  }
});

document.getElementById("devDot").addEventListener("click", ()=>{ view = "dev"; render(); });

document.addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){
    const pass = document.getElementById("loginPass");
    if(pass && document.activeElement === pass){ if(view === "admin") doLogin("admin"); if(view === "dev") doLogin("dev"); }
    const code = document.getElementById("shopCodeInput");
    if(code && document.activeElement === code){ enterShop("customer"); }
  }
});

/* ================= INSTALL PROMPT (PWA) ================= */
let deferredInstallPrompt = null;
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function showInstallBanner(mode){
  if(sessionStorage.getItem("cpos:installDismissed")) return;
  if(document.getElementById("installBanner")) return;
  const bar = document.createElement("div");
  bar.id = "installBanner";
  bar.className = "install-banner";
  bar.innerHTML = mode === "ios"
    ? `<span>Install Counter for quick, full-screen access: tap <strong>Share</strong> → <strong>Add to Home Screen</strong>.</span>
       <button class="btn btn-ghost btn-sm" data-action="dismiss-install-banner">Got it</button>`
    : `<span>Install Counter for faster, full-screen access on this device.</span>
       <button class="btn btn-primary btn-sm" data-action="install-app">Install</button>
       <button class="btn btn-ghost btn-sm" data-action="dismiss-install-banner">Not now</button>`;
  document.body.appendChild(bar);
}
function dismissInstallBanner(){
  sessionStorage.setItem("cpos:installDismissed", "1");
  const bar = document.getElementById("installBanner");
  if(bar) bar.remove();
}
function promptInstall(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(()=>{ deferredInstallPrompt = null; dismissInstallBanner(); });
}
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(!isStandalone()) showInstallBanner("prompt");
});
window.addEventListener("appinstalled", ()=>{
  deferredInstallPrompt = null;
  dismissInstallBanner();
  toast("Counter installed");
});
(function maybeShowIOSInstallHint(){
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if(isIOS && !isStandalone()) showInstallBanner("ios");
})();
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ---------------- init ---------------- */
loadAll().then(render).catch(function(err){
  console.error("Counter POS failed to load cleanly:", err);
  ready = true;
  render();
  toast("Started with limited storage — some changes may not be saved.");
});

})();
</script>
